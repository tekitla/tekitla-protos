// Contrato de Tekitla (issue 002): proyectos e issues dentro de un espacio de
// trabajo. Rebanada 1: estados agrupados en categorías fijas. Rebanada 3a:
// estados configurables por proyecto, orden manual, edición, etiquetas,
// comentarios e historial. Después (issues 011 a 013): descartar con motivo,
// búsqueda y filtros en la lista, y color, límite WIP y columnas ocultas en
// los estados. Miembros, roles y las piezas de cada metodología
// (sprints, tipos, jerarquía) llegan como campos y RPCs nuevos (aditivos).
//
// Reglas (detalle en CLAUDE.md):
//   - Nunca reusar ni renumerar un número de campo. No borrar campos de un
//     vN publicado: `[deprecated = true]` (si se borra, `reserved`).
//   - En v1 solo cambios aditivos; un cambio incompatible es un paquete v2.
//   - Enums con un primer valor <ENUM>_UNSPECIFIED = 0.
//   - `optional` cuando hay que distinguir "no vino" de "vino vacío/cero".
syntax = "proto3";

package issues.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

// IssueService gestiona los proyectos y sus issues.
//
// Todo acceso se limita a los espacios de trabajo del usuario autenticado (el
// gateway propaga su identidad en la metadata). En la rebanada 1 cada usuario
// tiene solo su espacio personal; desde la rebanada 3 un espacio es un tenant
// de la plataforma (issue 005) y workspace_id es su id. Un proyecto ajeno o no
// visible para el usuario responde NOT_FOUND, nunca PERMISSION_DENIED, para no
// revelar que existe.
//
// Las opciones google.api.http definen las rutas REST que expone el
// api-gateway (grpc-gateway). Una ruta anotada NO queda pública por estar
// acá: el gateway la expone solo si figura en su routes.yaml.
service IssueService {
  // Lista los proyectos visibles para el usuario en todos sus espacios de
  // trabajo (o en uno, con workspace_id), ordenados por nombre.
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse) {
    option (google.api.http) = {get: "/v1/projects"};
  }
  // Crea un proyecto. ALREADY_EXISTS si el espacio de trabajo ya tiene uno con
  // esa key.
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse) {
    option (google.api.http) = {
      post: "/v1/projects"
      body: "*"
    };
  }
  // Lista los issues de un proyecto con búsqueda, filtros y orden (ver
  // ListIssuesRequest). Sin ellos: todos, por rank ascendente (el orden
  // manual del backlog y de cada columna).
  rpc ListIssues(ListIssuesRequest) returns (ListIssuesResponse) {
    option (google.api.http) = {get: "/v1/projects/{project_id}/issues"};
  }
  // Devuelve un issue por su número dentro del proyecto.
  rpc GetIssue(GetIssueRequest) returns (GetIssueResponse) {
    option (google.api.http) = {get: "/v1/projects/{project_id}/issues/{number}"};
  }
  // Crea un issue en ISSUE_STATE_TODO con el siguiente número del proyecto y
  // lo ubica al final del orden (rank mayor que el de todos los demás).
  rpc CreateIssue(CreateIssueRequest) returns (CreateIssueResponse) {
    option (google.api.http) = {
      post: "/v1/projects/{project_id}/issues"
      body: "*"
    };
  }
  // Cambia el estado de un issue (mover de columna en el tablero) y,
  // opcionalmente, su lugar dentro de la columna (ver MoveIssueRequest).
  // Moverlo a CANCELED desde otra categoría lo descarta sin motivo
  // (Issue.discard queda ausente); entre estados CANCELED, Issue.discard se
  // mantiene; sacarlo de CANCELED lo borra. Pasarse del wip_limit
  // del estado destino no lo impide: el panel marca la columna excedida.
  rpc MoveIssue(MoveIssueRequest) returns (MoveIssueResponse) {
    option (google.api.http) = {
      post: "/v1/projects/{project_id}/issues/{number}:move"
      body: "*"
    };
  }
  // Edita título, descripción, prioridad o etiquetas de un issue. Solo cambia
  // lo que viene; cada cambio queda en el historial.
  rpc UpdateIssue(UpdateIssueRequest) returns (UpdateIssueResponse) {
    option (google.api.http) = {
      patch: "/v1/projects/{project_id}/issues/{number}"
      body: "*"
    };
  }
  // Descarta un issue con un motivo: pasa a un estado de categoría CANCELED,
  // conserva su rank y guarda el motivo en Issue.discard. FAILED_PRECONDITION
  // si ya está en un estado CANCELED.
  rpc DiscardIssue(DiscardIssueRequest) returns (DiscardIssueResponse) {
    option (google.api.http) = {
      post: "/v1/projects/{project_id}/issues/{number}:discard"
      body: "*"
    };
  }
  // Restaura un issue descartado (con o sin motivo): pasa al primer estado de
  // categoría TODO, al final de esa columna, y borra Issue.discard.
  // FAILED_PRECONDITION si no está en un estado CANCELED.
  rpc RestoreIssue(RestoreIssueRequest) returns (RestoreIssueResponse) {
    option (google.api.http) = {
      post: "/v1/projects/{project_id}/issues/{number}:restore"
      body: "*"
    };
  }

  // Estados del proyecto (las columnas del tablero), en orden. Todo proyecto
  // nace con cuatro, uno por categoría: Por hacer, En curso, Hecho y
  // Descartado.
  rpc ListStatuses(ListStatusesRequest) returns (ListStatusesResponse) {
    option (google.api.http) = {get: "/v1/projects/{project_id}/statuses"};
  }
  // Agrega un estado. ALREADY_EXISTS si ya hay uno con ese nombre;
  // FAILED_PRECONDITION si el proyecto ya tiene el máximo (20).
  rpc CreateStatus(CreateStatusRequest) returns (CreateStatusResponse) {
    option (google.api.http) = {
      post: "/v1/projects/{project_id}/statuses"
      body: "*"
    };
  }
  // Renombra o reubica un estado. La categoría no cambia: para eso se crea
  // otro y se borra este pasando sus issues.
  rpc UpdateStatus(UpdateStatusRequest) returns (UpdateStatusResponse) {
    option (google.api.http) = {
      patch: "/v1/projects/{project_id}/statuses/{status_id}"
      body: "*"
    };
  }
  // Borra un estado y pasa sus issues a move_to_status_id. FAILED_PRECONDITION
  // si es el último de su categoría, o si tiene issues y no viene destino.
  rpc DeleteStatus(DeleteStatusRequest) returns (DeleteStatusResponse) {
    option (google.api.http) = {delete: "/v1/projects/{project_id}/statuses/{status_id}"};
  }
  // Guarda la lista completa de estados de una vez (Ajustes › Estados):
  // crea, renombra, reordena, cambia color, WIP o visibilidad y borra en una
  // sola transacción, todo o nada. Valida las mismas reglas que los RPC
  // sueltos sobre el resultado final (ver BatchUpdateStatusesRequest).
  rpc BatchUpdateStatuses(BatchUpdateStatusesRequest) returns (BatchUpdateStatusesResponse) {
    option (google.api.http) = {
      post: "/v1/projects/{project_id}/statuses:batchUpdate"
      body: "*"
    };
  }

  // Etiquetas del proyecto, por nombre.
  rpc ListLabels(ListLabelsRequest) returns (ListLabelsResponse) {
    option (google.api.http) = {get: "/v1/projects/{project_id}/labels"};
  }
  // Crea una etiqueta. ALREADY_EXISTS si ya hay una con ese nombre;
  // FAILED_PRECONDITION si el proyecto ya tiene el máximo (100).
  rpc CreateLabel(CreateLabelRequest) returns (CreateLabelResponse) {
    option (google.api.http) = {
      post: "/v1/projects/{project_id}/labels"
      body: "*"
    };
  }
  // Renombra o cambia el color de una etiqueta.
  rpc UpdateLabel(UpdateLabelRequest) returns (UpdateLabelResponse) {
    option (google.api.http) = {
      patch: "/v1/projects/{project_id}/labels/{label_id}"
      body: "*"
    };
  }
  // Borra una etiqueta y la quita de todos los issues (sin evento en su
  // historial).
  rpc DeleteLabel(DeleteLabelRequest) returns (DeleteLabelResponse) {
    option (google.api.http) = {delete: "/v1/projects/{project_id}/labels/{label_id}"};
  }

  // Comenta un issue. El comentario aparece en su historial.
  rpc CreateComment(CreateCommentRequest) returns (CreateCommentResponse) {
    option (google.api.http) = {
      post: "/v1/projects/{project_id}/issues/{number}/comments"
      body: "*"
    };
  }
  // Historial de un issue (cambios y comentarios), del más viejo al más nuevo.
  rpc ListIssueEvents(ListIssueEventsRequest) returns (ListIssueEventsResponse) {
    option (google.api.http) = {get: "/v1/projects/{project_id}/issues/{number}/events"};
  }
}

// Categoría del estado de un issue. Es fija y la entienden todos los clientes
// sin importar la metodología del proyecto: `tk start` mueve a IN_PROGRESS,
// los reportes cuentan como cerrados DONE y CANCELED.
//
// Cada proyecto define sus estados concretos (Status, las columnas del
// tablero) y cada uno pertenece a una de estas categorías; varias columnas
// pueden compartir categoría. Issue.state es siempre la categoría de
// Issue.status_id.
enum IssueState {
  ISSUE_STATE_UNSPECIFIED = 0;
  // Por hacer.
  ISSUE_STATE_TODO = 1;
  // En curso.
  ISSUE_STATE_IN_PROGRESS = 2;
  // Hecho.
  ISSUE_STATE_DONE = 3;
  // Descartado: cerrado sin hacerse.
  ISSUE_STATE_CANCELED = 4;
}

// Prioridad de un issue. Al crear, UNSPECIFIED se guarda como MEDIUM.
enum Priority {
  PRIORITY_UNSPECIFIED = 0;
  PRIORITY_LOW = 1;
  PRIORITY_MEDIUM = 2;
  PRIORITY_HIGH = 3;
  PRIORITY_URGENT = 4;
}

message Project {
  string id = 1;
  // Clave corta y única por espacio de trabajo, en mayúsculas (2 a 10 letras o dígitos,
  // empieza con letra), p. ej. "TK". Los issues se nombran TK-42.
  string key = 2;
  string name = 3;
  string description = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  // Espacio de trabajo dueño del proyecto (personal o de un equipo). En la
  // rebanada 1 siempre es el espacio personal del usuario.
  string workspace_id = 7;
}

message Issue {
  string id = 1;
  string project_id = 2;
  // Número correlativo dentro del proyecto, desde 1. No se reutiliza.
  int32 number = 3;
  string title = 4;
  // Markdown.
  string description = 5;
  IssueState state = 6;
  Priority priority = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  // Posición en el orden manual del proyecto, opaca. Se compara como string
  // (orden lexicográfico); el cliente no la calcula ni la interpreta. El orden
  // de una columna es el de sus issues por rank.
  string rank = 10;
  // Estado concreto (columna). state es su categoría.
  string status_id = 11;
  // Etiquetas del issue, ordenadas por nombre de etiqueta.
  repeated string label_ids = 12;
  // Motivo del descarte: lo pone DiscardIssue. Ausente si se descartó con
  // MoveIssue (descartado sin motivo) o si no está descartado. Se mantiene
  // al pasar de un estado CANCELED a otro y se borra cuando el issue sale de
  // CANCELED por cualquier vía (MoveIssue, RestoreIssue, o DeleteStatus y
  // BatchUpdateStatuses al mover los issues de un estado borrado).
  DiscardInfo discard = 13;
}

// Quién descartó un issue con DiscardIssue, cuándo y por qué.
message DiscardInfo {
  // Sin espacios en los extremos, 1 a 500 caracteres.
  string reason = 1;
  // uid de quien lo descartó.
  string actor_id = 2;
  google.protobuf.Timestamp discarded_at = 3;
}

// Estado concreto de un proyecto: una columna del tablero.
message Status {
  string id = 1;
  string project_id = 2;
  // Único en el proyecto (sin distinguir mayúsculas), 1 a 40 caracteres.
  string name = 3;
  // Categoría: la que ven los clientes que no conocen los estados del
  // proyecto (la CLI, los reportes).
  IssueState category = 4;
  // Posición en el orden de columnas, opaca (como Issue.rank).
  string rank = 5;
  // Tono de la columna. Siempre viene con valor: al crear o actualizar,
  // UNSPECIFIED se guarda como el tono de su categoría (TODO: NEUTRAL,
  // IN_PROGRESS: INFO, DONE: SUCCESS, CANCELED: DANGER).
  LabelColor color = 6;
  // Máximo de issues en la columna; 0 = sin límite (negativo es
  // INVALID_ARGUMENT). Pasarse avisa, no bloquea: la API mueve igual y el
  // panel marca la columna como excedida.
  int32 wip_limit = 7;
  // La columna no se muestra en el tablero; sus issues sí salen en
  // ListIssues. Los estados CANCELED nacen ocultos, y los que existían antes
  // de este campo (v0.3.0) se migran con hidden = true; los demás, visibles.
  bool hidden = 8;
}

// Tono del design system, no un valor libre: color de una etiqueta (Label)
// y de un estado (Status).
enum LabelColor {
  // En Label se guarda como NEUTRAL; en Status, como el tono de su categoría.
  LABEL_COLOR_UNSPECIFIED = 0;
  LABEL_COLOR_NEUTRAL = 1;
  LABEL_COLOR_INFO = 2;
  LABEL_COLOR_SUCCESS = 3;
  LABEL_COLOR_WARNING = 4;
  LABEL_COLOR_DANGER = 5;
  LABEL_COLOR_ACCENT = 6;
  LABEL_COLOR_BRAND = 7;
}

message Label {
  string id = 1;
  string project_id = 2;
  // Único en el proyecto (sin distinguir mayúsculas), 1 a 40 caracteres.
  string name = 3;
  LabelColor color = 4;
}

message Comment {
  string id = 1;
  string issue_id = 2;
  // uid de quien lo escribió. Nombre y avatar los resuelve el cliente con
  // accounts-service (rebanada 3b).
  string author_id = 3;
  // Markdown, 1 a 10 000 caracteres.
  string body = 4;
  google.protobuf.Timestamp created_at = 5;
}

// Un cambio en un issue, para su historial. Reordenar dentro de la misma
// columna no genera evento.
message IssueEvent {
  string id = 1;
  string issue_id = 2;
  // uid de quien hizo el cambio.
  string actor_id = 3;
  google.protobuf.Timestamp created_at = 4;
  oneof change {
    IssueCreated created = 5;
    StatusChanged status_changed = 6;
    TitleChanged title_changed = 7;
    DescriptionChanged description_changed = 8;
    PriorityChanged priority_changed = 9;
    LabelsChanged labels_changed = 10;
    Comment commented = 11;
    IssueDiscarded discarded = 12;
    IssueRestored restored = 13;
  }
}

message IssueCreated {}

// Los nombres se guardan al momento del cambio: el historial se sigue
// leyendo aunque el estado después se renombre o se borre.
message StatusChanged {
  string from_status_id = 1;
  string from_status_name = 2;
  IssueState from_state = 3;
  string to_status_id = 4;
  string to_status_name = 5;
  IssueState to_state = 6;
}

// Descartado con DiscardIssue. Descartar con MoveIssue registra un
// StatusChanged. Los nombres se guardan como en StatusChanged.
message IssueDiscarded {
  string reason = 1;
  string from_status_id = 2;
  string from_status_name = 3;
  IssueState from_state = 4;
  // Siempre de categoría CANCELED.
  string to_status_id = 5;
  string to_status_name = 6;
}

// Restaurado con RestoreIssue. Los nombres se guardan como en StatusChanged.
message IssueRestored {
  // Siempre de categoría CANCELED.
  string from_status_id = 1;
  string from_status_name = 2;
  // Siempre de categoría TODO.
  string to_status_id = 3;
  string to_status_name = 4;
}

message TitleChanged {
  string from = 1;
  string to = 2;
}

// La descripción puede ser larga: el evento solo dice que cambió.
message DescriptionChanged {}

message PriorityChanged {
  Priority from = 1;
  Priority to = 2;
}

// Los nombres de las etiquetas se guardan al momento del cambio (ver
// StatusChanged).
message LabelsChanged {
  repeated string added_label_ids = 1;
  repeated string removed_label_ids = 2;
  repeated string added_label_names = 3;
  repeated string removed_label_names = 4;
}

// PageRequest: paginación por cursor opaco. limit <= 0 usa el default del servicio.
message PageRequest {
  string cursor = 1;
  int32 limit = 2;
}

// PageResponse: next_cursor vacío y has_next=false en la última página.
message PageResponse {
  string next_cursor = 1;
  bool has_next = 2;
}

message ListProjectsRequest {
  PageRequest page = 1;
  // Vacío: todos los espacios del usuario. Un espacio ajeno devuelve la lista
  // vacía, no un error, para no revelar que existe.
  string workspace_id = 2;
}

message ListProjectsResponse {
  repeated Project projects = 1;
  PageResponse page = 2;
}

message CreateProjectRequest {
  string key = 1;
  string name = 2;
  string description = 3;
  // Vacío: el espacio personal del usuario (el único en la rebanada 1).
  string workspace_id = 4;
}

message CreateProjectResponse {
  Project project = 1;
}

// Los filtros se combinan con Y; dentro de un filtro repetido, con O. Un
// filtro vacío no filtra.
message ListIssuesRequest {
  string project_id = 1;
  // Una categoría; UNSPECIFIED: todas. Para varias, states. Mandar state y
  // states a la vez es INVALID_ARGUMENT.
  IssueState state = 2;
  // Paginación. El cursor codifica orden y filtros: usarlo con otros
  // filtros u otro orden es INVALID_ARGUMENT (el cliente vuelve a la primera
  // página).
  PageRequest page = 3;
  // Texto a buscar, hasta 200 caracteres (más es INVALID_ARGUMENT). Coincide
  // con parte del título sin distinguir mayúsculas ni acentos. Si además es
  // una clave del proyecto ("TK-12" o "tk-12": la key sin distinguir
  // mayúsculas) o un número ("12"), también trae ese issue: "12" devuelve el
  // #12 y los títulos que contienen "12". Vacío o solo espacios: sin
  // búsqueda.
  string query = 4;
  // Categorías, p. ej. [TODO, IN_PROGRESS] para los activos. UNSPECIFIED
  // dentro de la lista es INVALID_ARGUMENT.
  repeated IssueState states = 5;
  // Estados concretos. Uno de otro proyecto es INVALID_ARGUMENT.
  repeated string status_ids = 6;
  // Prioridades. UNSPECIFIED dentro de la lista es INVALID_ARGUMENT.
  repeated Priority priorities = 7;
  // Etiquetas: pasa un issue con cualquiera de ellas. Una de otro proyecto
  // es INVALID_ARGUMENT.
  repeated string label_ids = 8;
  // UNSPECIFIED: ISSUE_ORDER_RANK.
  IssueOrder order_by = 9;
}

// Orden de ListIssues. Los empates se resuelven por rank, así el orden es
// estable entre páginas.
enum IssueOrder {
  ISSUE_ORDER_UNSPECIFIED = 0;
  // rank ascendente: el orden manual del tablero.
  ISSUE_ORDER_RANK = 1;
  // updated_at descendente: lo último que cambió, primero.
  ISSUE_ORDER_UPDATED_DESC = 2;
  // Prioridad descendente: URGENT primero. Ningún issue guardado tiene
  // PRIORITY_UNSPECIFIED (CreateIssue lo guarda como MEDIUM).
  ISSUE_ORDER_PRIORITY_DESC = 3;
}

message ListIssuesResponse {
  repeated Issue issues = 1;
  PageResponse page = 2;
}

message GetIssueRequest {
  string project_id = 1;
  int32 number = 2;
}

message GetIssueResponse {
  Issue issue = 1;
}

message CreateIssueRequest {
  string project_id = 1;
  string title = 2;
  string description = 3;
  Priority priority = 4;
}

message CreateIssueResponse {
  Issue issue = 1;
}

message MoveIssueRequest {
  string project_id = 1;
  int32 number = 2;
  // Categoría destino, para los clientes que no conocen los estados del
  // proyecto: el issue va al primer estado de esa categoría (si ya está en
  // esa categoría, no cambia de estado). Se ignora si viene status_id.
  // UNSPECIFIED sin status_id es INVALID_ARGUMENT.
  IssueState state = 3;
  // Estado destino. Uno de otro proyecto es INVALID_ARGUMENT.
  string status_id = 4;
  // Lugar dentro de la columna destino, tal como el cliente la ve: debajo de
  // after_number y arriba de before_number (0 = sin vecino de ese lado). Con
  // los dos en 0 conserva su rank. FAILED_PRECONDITION si los vecinos ya no
  // están en esa columna o en ese orden (la vista está vieja: recargar).
  int32 before_number = 5;
  int32 after_number = 6;
}

message MoveIssueResponse {
  Issue issue = 1;
}

message UpdateIssueRequest {
  string project_id = 1;
  int32 number = 2;
  // Solo cambia lo que viene. Título vacío es INVALID_ARGUMENT.
  optional string title = 3;
  optional string description = 4;
  // UNSPECIFIED es INVALID_ARGUMENT.
  optional Priority priority = 5;
  // Reemplaza las etiquetas del issue; ausente, no cambian. Una etiqueta de
  // otro proyecto es INVALID_ARGUMENT.
  LabelIds labels = 6;
}

// Lista de ids de etiquetas, con presencia: un mensaje ausente no es una
// lista vacía.
message LabelIds {
  repeated string ids = 1;
}

message UpdateIssueResponse {
  Issue issue = 1;
}

message DiscardIssueRequest {
  string project_id = 1;
  int32 number = 2;
  // Obligatorio: 1 a 500 caracteres sin contar los espacios de los extremos
  // (se guarda sin ellos). Vacío o solo espacios es INVALID_ARGUMENT.
  string reason = 3;
  // Estado CANCELED destino, si el proyecto tiene varios. Vacío: el primero
  // de esa categoría en el orden de columnas. Uno de otra categoría o de
  // otro proyecto es INVALID_ARGUMENT.
  string status_id = 4;
}

message DiscardIssueResponse {
  Issue issue = 1;
}

message RestoreIssueRequest {
  string project_id = 1;
  int32 number = 2;
}

message RestoreIssueResponse {
  Issue issue = 1;
}

message ListStatusesRequest {
  string project_id = 1;
}

// Sin paginar: son 20 como máximo.
message ListStatusesResponse {
  repeated Status statuses = 1;
}

message CreateStatusRequest {
  string project_id = 1;
  string name = 2;
  // UNSPECIFIED es INVALID_ARGUMENT.
  IssueState category = 3;
  // Queda después de este estado; vacío: al final.
  string after_status_id = 4;
  // Ver Status.color, Status.wip_limit y Status.hidden. Sin hidden, un
  // estado CANCELED nace oculto y los demás visibles.
  LabelColor color = 5;
  int32 wip_limit = 6;
  optional bool hidden = 7;
}

message CreateStatusResponse {
  Status status = 1;
}

message UpdateStatusRequest {
  string project_id = 1;
  string status_id = 2;
  optional string name = 3;
  // Reubica el estado después de este; presente y vacío: al principio.
  optional string after_status_id = 4;
  // Ver Status.color, Status.wip_limit y Status.hidden.
  optional LabelColor color = 5;
  optional int32 wip_limit = 6;
  optional bool hidden = 7;
}

message UpdateStatusResponse {
  Status status = 1;
}

message DeleteStatusRequest {
  string project_id = 1;
  string status_id = 2;
  // Estado al que pasan sus issues (puede ser de otra categoría; cada issue
  // movido lo registra en su historial). Obligatorio si el estado tiene
  // issues.
  string move_to_status_id = 3;
}

message DeleteStatusResponse {}

// La lista completa de estados como debe quedar, en el orden de columnas.
//
// - Un estado del proyecto que no está en statuses ni en deletions es
//   FAILED_PRECONDITION: la vista está vieja (otro lo creó), recargar.
// - Mismas reglas que los RPC sueltos sobre el resultado: máximo 20
//   (FAILED_PRECONDITION), al menos uno por categoría (FAILED_PRECONDITION),
//   nombres únicos (ALREADY_EXISTS).
// - Cada issue que pasa de un estado borrado a otro deja su evento
//   status_changed.
// - Sin control de versión: lo que viene pisa lo guardado (como UpdateStatus).
//   Si otro editó un estado mientras tanto, su cambio se pierde.
message BatchUpdateStatusesRequest {
  string project_id = 1;
  repeated StatusSpec statuses = 2;
  // Estados que se borran. Ninguno puede estar también en statuses.
  repeated StatusDeletion deletions = 3;
}

// Un estado tal como debe quedar. La posición en la lista define su rank.
message StatusSpec {
  // Vacío: estado nuevo. Uno de otro proyecto es INVALID_ARGUMENT.
  string id = 1;
  // 1 a 40 caracteres.
  string name = 2;
  // Obligatoria en un estado nuevo. En uno existente no cambia: UNSPECIFIED
  // o la misma; otra es INVALID_ARGUMENT.
  IssueState category = 3;
  LabelColor color = 4;
  int32 wip_limit = 5;
  bool hidden = 6;
}

message StatusDeletion {
  string status_id = 1;
  // Estado al que pasan sus issues, como en DeleteStatusRequest: obligatorio
  // si tiene issues. Tiene que ser un estado existente que queda en
  // statuses (no uno nuevo del mismo request); si no, INVALID_ARGUMENT.
  string move_to_status_id = 2;
}

// Los estados del proyecto ya guardados, en orden (como ListStatuses).
message BatchUpdateStatusesResponse {
  repeated Status statuses = 1;
}

message ListLabelsRequest {
  string project_id = 1;
}

// Sin paginar: son 100 como máximo.
message ListLabelsResponse {
  repeated Label labels = 1;
}

message CreateLabelRequest {
  string project_id = 1;
  string name = 2;
  LabelColor color = 3;
}

message CreateLabelResponse {
  Label label = 1;
}

message UpdateLabelRequest {
  string project_id = 1;
  string label_id = 2;
  optional string name = 3;
  // UNSPECIFIED se guarda como NEUTRAL.
  optional LabelColor color = 4;
}

message UpdateLabelResponse {
  Label label = 1;
}

message DeleteLabelRequest {
  string project_id = 1;
  string label_id = 2;
}

message DeleteLabelResponse {}

message CreateCommentRequest {
  string project_id = 1;
  int32 number = 2;
  string body = 3;
}

message CreateCommentResponse {
  Comment comment = 1;
}

message ListIssueEventsRequest {
  string project_id = 1;
  int32 number = 2;
  PageRequest page = 3;
}

message ListIssueEventsResponse {
  repeated IssueEvent events = 1;
  PageResponse page = 2;
}

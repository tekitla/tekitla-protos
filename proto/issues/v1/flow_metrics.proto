// Métricas de flujo de un proyecto (issue 036, parte 2): lo que devuelve
// IssueService.GetFlowMetrics. Miden el sistema, no a las personas: dónde
// espera el trabajo y cuánto tarda en llegar. Cada número dice de dónde
// sale (MetricSource): registrado en vivo o reconstruido de un importador.
//
// Cómo se calcula (lo implementa tekitla-issues):
//   - Línea de tiempo de cada issue: sus cambios de categoría (StatusChanged,
//     IssueDiscarded, IssueRestored) por created_at. Cuenta la categoría de
//     destino; una transición a la categoría en la que ya está no hace nada.
//     Los eventos EVENT_SOURCE_IMPORT_SYNC llevan la fecha de la corrida:
//     cuentan solo si son posteriores al último evento importado con fecha
//     (IMPORT_HISTORY o IMPORT_FILE) del issue, o si no tiene ninguno.
//   - Categoría inicial (desde el alta): la de IssueCreated.state si el alta
//     es EVENT_SOURCE_LIVE y lo trae (creados desde v0.8.0); si no, la de
//     origen de la primera transición que cuenta, y sin transiciones, la
//     actual. Nacer en IN_PROGRESS (p. ej. un importado sin histórico)
//     cuenta como empezar en el alta. Nacer en DONE:
//       - con IssueCreated.state (alta en vivo en una columna de DONE):
//         cuenta como terminado la semana del alta (closed_value o
//         closed_other, con su fuente), pero no entra en lead ni cycle
//         time: se registró ya hecho, sin duración medida;
//       - sin él: no es terminar (FlowCoverage.done_without_dates).
//     Si el historial no termina en el estado actual del issue, mandan el
//     historial y sus fechas.
//   - Terminado: la última entrada a DONE dentro de la semana, si el issue
//     sigue en DONE al final de ella. Un reabierto vuelve a contar cuando
//     vuelve a entrar.
//   - Lead time: del alta a esa entrada. Cycle time: de la primera entrada a
//     IN_PROGRESS a esa entrada (sin paso por IN_PROGRESS no tiene). Ninguno
//     de los dos si esa entrada es el alta misma (nació en DONE).
syntax = "proto3";

package issues.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "issues/v1/agent_sessions.proto";

message GetFlowMetricsRequest {
  string project_id = 1;
  // Período. Sin from: 12 semanas antes de to. Sin to, o con un to futuro:
  // ahora. from no anterior a to, o un Timestamp fuera de rango →
  // INVALID_ARGUMENT (reason INVALID_PERIOD); más de 104 semanas →
  // INVALID_ARGUMENT (PERIOD_TOO_LONG).
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
  // Zona IANA que define las semanas: de lunes 00:00 a lunes 00:00 en esa
  // zona (donde el cambio de horario se salta las 00:00, desde la primera
  // hora que existe ese día). Vacía: "America/Mexico_City". Desconocida → INVALID_ARGUMENT
  // (INVALID_TIME_ZONE).
  string time_zone = 4;
  // Solo los issues con alguna de estas etiquetas (p. ej. un área o un
  // repo). Vacío: todos. Una etiqueta que no es del proyecto →
  // INVALID_ARGUMENT (UNKNOWN_LABEL).
  repeated string label_ids = 5;
  // Días sin actividad para que un issue en curso cuente como estancado.
  // 0: 30. Entre 1 y 365 (si no, INVALID_ARGUMENT, INVALID_STALE_AFTER_DAYS).
  int32 stale_after_days = 6;
  // Máximo de estancados en la respuesta. 0: 20. Entre 1 y 100 (si no,
  // INVALID_ARGUMENT, INVALID_STALE_LIMIT).
  int32 stale_limit = 7;
}

message GetFlowMetricsResponse {
  // Período efectivo, con los valores por defecto aplicados.
  google.protobuf.Timestamp from = 1;
  google.protobuf.Timestamp to = 2;
  string time_zone = 3;
  // Una por semana del período, en orden. La primera y la última se
  // recortan a from y to.
  repeated FlowWeek weeks = 4;
  // Las semanas juntas (ver FlowSummary). Un período del todo futuro es
  // INVALID_PERIOD: to se recorta a ahora.
  FlowSummary summary = 5;
  // Issues en IN_PROGRESS en to sin actividad en los stale_after_days días
  // anteriores a to (la actividad posterior a to no cuenta),
  // del que lleva más tiempo en curso al que menos. A lo sumo stale_limit.
  // Actividad: cualquier evento en vivo (también comentarios y ediciones),
  // los importados con fecha (IMPORT_HISTORY, IMPORT_FILE), las
  // transiciones IMPORT_SYNC que cuentan y el alta. Los demás IMPORT_SYNC
  // no: su fecha es la de la corrida del importador.
  repeated StaleIssue stale = 6;
  // Cuántos estancados hay en total (puede ser más que los de stale).
  int32 stale_total = 7;
  // Etiquetas de valor del proyecto (Label.counts_as_value). Vacío: el
  // proyecto no tiene, y todo lo terminado cuenta como valor (closed_other
  // es 0).
  repeated string value_label_ids = 8;
  // Issues que entran al cálculo y los que no tienen fechas para él.
  FlowCoverage coverage = 9;
  // Desde cuándo hay historia de sesiones de agentes en el proyecto (la
  // primera transición guardada, issue 036 parte 3). Ausente: ninguna. Las
  // semanas que terminan antes no traen efficiency ni human_queue.
  google.protobuf.Timestamp sessions_recorded_since = 10;
  // Señal de contratación de las 8 semanas completas anteriores a to (no
  // depende de from).
  HiringSignal hiring_signal = 11;
}

// Métricas de una semana.
message FlowWeek {
  google.protobuf.Timestamp start = 1;
  google.protobuf.Timestamp end = 2;
  // De todos los issues que terminaron esta semana (valor y otros).
  DurationStats lead_time = 3;
  DurationStats cycle_time = 4;
  // Terminados con alguna etiqueta de valor y el resto. Sin etiquetas de
  // valor en el proyecto, todos van a closed_value.
  int32 closed_value = 5;
  int32 closed_other = 6;
  // Entraron a CANCELED esta semana y siguen ahí al final de ella.
  int32 canceled = 7;
  // Entraron a IN_PROGRESS por primera vez esta semana.
  int32 started = 8;
  // En IN_PROGRESS al final de la semana.
  int32 wip = 9;
  MetricSource source = 10;
  // Dónde se fue el tiempo esta semana, según las sesiones de agentes.
  // Ausente si la semana termina antes de sessions_recorded_since.
  FlowEfficiency efficiency = 11;
  // Esperas a una persona. Ausente igual que efficiency.
  HumanQueue human_queue = 12;
}

// Métricas de todo el período: las semanas juntas. Los conteos son la suma
// de los de las semanas (un issue reabierto que vuelve a terminar en otra
// semana cuenta dos veces) y las duraciones son las de todos los
// terminados del período. wip es el de to. source también es la suma de
// las semanas: una transición que sostiene números de dos semanas (la
// entrada a IN_PROGRESS de un issue que empieza en una y termina en otra)
// cuenta en las dos.
message FlowSummary {
  DurationStats lead_time = 1;
  DurationStats cycle_time = 2;
  int32 closed_value = 3;
  int32 closed_other = 4;
  int32 canceled = 5;
  int32 started = 6;
  // En IN_PROGRESS en to.
  int32 wip = 7;
  MetricSource source = 8;
  // Suma de las semanas. Ausente si ninguna semana tiene.
  FlowEfficiency efficiency = 9;
  // pending y oldest_pending en to; response_time de todo el período.
  // Ausente igual que efficiency.
  HumanQueue human_queue = 10;
}

// Mediana y percentil 85 de una duración.
message DurationStats {
  int32 count = 1;
  // Ausentes si count es 0. Percentil por rango más cercano.
  google.protobuf.Duration median = 2;
  google.protobuf.Duration p85 = 3;
}

// De dónde salen los números: cuántas transiciones de cada fuente los
// sostienen (para lead y cycle time, la entrada a DONE y la entrada a
// IN_PROGRESS) y la confianza que resulta. En una semana, cada transición
// cuenta una vez aunque sostenga dos números (la entrada a IN_PROGRESS de un
// issue que empieza y termina en la misma semana).
message MetricSource {
  MetricConfidence confidence = 1;
  int32 live = 2;
  int32 import_history = 3;
  int32 import_file = 4;
  int32 import_sync = 5;
}

// Qué tan confiable es un número.
enum MetricConfidence {
  METRIC_CONFIDENCE_UNSPECIFIED = 0;
  // No hay transiciones que lo sostengan.
  METRIC_CONFIDENCE_NO_DATA = 1;
  // Todo registrado en vivo por Tekitla.
  METRIC_CONFIDENCE_RECORDED = 2;
  // Algo sale de un importador: histórico aproximado (fechas de commits o
  // del archivo de origen, o de la corrida del importador).
  METRIC_CONFIDENCE_APPROXIMATE = 3;
}

// Un issue en curso sin actividad reciente.
message StaleIssue {
  int32 number = 1;
  // Título y estado actuales (no los de to).
  string title = 2;
  string status_id = 3;
  // Desde cuándo está en curso: la última entrada a IN_PROGRESS (el alta si
  // nació en curso).
  google.protobuf.Timestamp in_progress_since = 4;
  // Último evento que cuenta como actividad (ver GetFlowMetricsResponse.stale).
  google.protobuf.Timestamp last_activity_at = 5;
  // De la entrada a IN_PROGRESS.
  MetricConfidence confidence = 6;
}

message FlowCoverage {
  // Issues del proyecto (con el filtro de etiquetas) que entran al cálculo.
  int32 issues = 1;
  // En DONE sin ninguna transición con fecha que lo lleve ahí ni un alta en
  // vivo en DONE (p. ej. importados ya cerrados y sin histórico): no entran
  // a lead time, cycle time ni cerrados.
  int32 done_without_dates = 2;
}

// Dónde se va el tiempo de un issue (o de los issues de un período) según
// el estado de sus sesiones de agentes (issue 026). Issue 036, CU-036-6.
// Siempre registrado en vivo: el histórico importado no tiene sesiones.
//
// Cómo se calcula (lo implementa tekitla-issues):
//   - Tiempo de reloj del issue, no suma de horas de agente: en cada
//     instante el issue está en un solo estado, el de mayor prioridad entre
//     sus sesiones: working > waiting_human > blocked > in_review > idle.
//     Dos sesiones trabajando a la vez una hora dan una hora.
//   - Cuentan las sesiones de todas las personas con acceso al proyecto, sin
//     detalle por persona (CU-036-9). Solo las ligadas a issues que existen.
//   - Noches y fines de semana cuentan como cualquier otra hora.
//   - Una sesión deja de contar desde su último reporte si pasa más de 10
//     minutos sin reportar (máquina apagada o recolector parado), hasta que
//     vuelve a reportar. Ese tiempo no es trabajo ni espera.
//   - Nada cuenta después de ahora.
message FlowEfficiency {
  // Alguna sesión del issue en WORKING.
  google.protobuf.Duration working = 1;
  // Ninguna trabaja y alguna espera a su persona (waiting_on PERSON, en
  // WAITING_OK o en IDLE).
  google.protobuf.Duration waiting_human = 2;
  // Ninguna trabaja ni espera a una persona, y alguna espera a otra sesión o
  // a otra cosa (waiting_on SESSION u OTHER: un CI, un merge).
  google.protobuf.Duration blocked = 3;
  // MR abierto en revisión (issue 016). 0 hasta que exista esa fuente.
  google.protobuf.Duration in_review = 4;
  // Solo sesiones en IDLE o UNKNOWN sin esperar nada: no entra en la
  // eficiencia.
  google.protobuf.Duration idle = 5;
  // working / (working + waiting_human + blocked + in_review) × 10 000, en
  // puntos base (redondeado hacia abajo). Ausente si el denominador es 0.
  // Con 3 h en WORKING y 5 h esperando a su persona: 3750.
  optional int32 efficiency_bp = 6;
  // Issues con algún tiempo medido.
  int32 issues = 7;
  // Cómo se reparte waiting_human por motivo, de mayor a menor. Las partes
  // suman waiting_human (incluye UNSPECIFIED: sin motivo).
  repeated ReasonTime waiting_human_by_reason = 8;
}

// Tiempo de espera a una persona con un motivo.
message ReasonTime {
  WaitingReason reason = 1;
  google.protobuf.Duration duration = 2;
}

// Esperas a una persona: la cola humana (issue 036). Una espera es un tramo
// continuo en que el issue está en waiting_human (después de aplicar la
// prioridad de FlowEfficiency). Termina cuando el issue pasa a otro estado;
// si se corta porque sus sesiones dejan de reportar, no cuenta como
// respuesta.
message HumanQueue {
  // Issues esperando a una persona al final de la semana (o en to).
  int32 pending = 1;
  // De las esperas que terminaron en la semana (o en el período): cuánto
  // duraron, de entrar a salir.
  DurationStats response_time = 2;
  // La espera abierta más vieja al final de la semana (o en to). Ausente si
  // pending es 0.
  google.protobuf.Duration oldest_pending = 3;
}

// Señal de contratación (issue 036, parte 3): interpreta las métricas del
// último mes. Es una señal, no una decisión: trae los números que la
// sostienen.
//
// Cómo se calcula (lo implementa tekitla-issues), sobre las semanas
// completas (lunes a lunes en time_zone) anteriores a to:
//   - current: las últimas 4; previous: las 4 anteriores.
//   - Menos de 4 semanas completas con historia de sesiones:
//     INSUFFICIENT_DATA. De 4 a 7: preliminary, sin previous y sin las
//     condiciones de crecimiento.
//   - NEEDS_PEOPLE (CU-036-7), todas:
//       1. waiting_human ≥ 30 % de working + waiting_human + blocked +
//          in_review en current;
//       2. (no preliminar) waiting_human o la mediana de human_response
//          creció 25 % o más contra previous;
//       3. los agentes no son el cuello: working ≤ waiting_human.
//   - REDUCE_WIP (CU-036-8): waiting_human < 15 % y wip_high.
//   - wip_high: wip_median ≥ 2 × los cerrados por semana de current (más de
//     dos semanas de trabajo empezado), o (no preliminar) wip_median creció
//     25 % o más contra previous.
//   - Si se cumplen las dos, NEEDS_PEOPLE (y wip_high lo dice).
//   - Los umbrales son constantes del servicio: cambiarlos no cambia el
//     contrato.
message HiringSignal {
  HiringVerdict verdict = 1;
  // Semanas completas con historia de sesiones antes de to (hasta 8).
  int32 live_weeks = 2;
  // Semanas que hacen falta para la señal completa (8).
  int32 weeks_needed = 3;
  // Semanas que hacen falta para la lectura preliminar (4).
  int32 weeks_needed_preliminary = 4;
  // De 4 a 7 semanas: lectura preliminar, sin comparar con el mes anterior.
  bool preliminary = 5;
  // El WIP es alto (ver arriba). Falso con INSUFFICIENT_DATA.
  bool wip_high = 6;
  // Dónde se junta la espera a personas en current: los motivos de
  // waiting_human_by_reason sin UNSPECIFIED, con su parte de waiting_human.
  // De mayor a menor. Vacío si ninguna espera trae motivo.
  repeated ProfileShare profiles = 7;
  // Las últimas 4 semanas. Ausente con INSUFFICIENT_DATA.
  SignalWindow current = 8;
  // Las 4 anteriores. Ausente si es preliminar o con INSUFFICIENT_DATA.
  SignalWindow previous = 9;
}

// Qué dice la señal de contratación.
enum HiringVerdict {
  HIRING_VERDICT_UNSPECIFIED = 0;
  // Menos de 4 semanas completas con historia de sesiones.
  HIRING_VERDICT_INSUFFICIENT_DATA = 1;
  // El flujo no pide nada.
  HIRING_VERDICT_NO_SIGNAL = 2;
  // El trabajo espera a personas: falta gente (el perfil, en profiles).
  HIRING_VERDICT_NEEDS_PEOPLE = 3;
  // No falta gente, sobra trabajo empezado: bajar el WIP.
  HIRING_VERDICT_REDUCE_WIP = 4;
}

// Los números de 4 semanas que sostienen la señal.
message SignalWindow {
  google.protobuf.Timestamp start = 1;
  google.protobuf.Timestamp end = 2;
  FlowEfficiency efficiency = 3;
  // De las esperas a una persona que terminaron en la ventana.
  DurationStats human_response = 4;
  // Mediana del WIP de fin de semana.
  int32 wip_median = 5;
  // Terminados en la ventana (valor y otros).
  int32 closed = 6;
}

// Parte de la espera a personas con un motivo (el perfil que haría falta:
// revisión → alguien senior que revise, pruebas → QA, decisión → producto,
// deploy → DevOps).
message ProfileShare {
  WaitingReason reason = 1;
  // Parte de waiting_human, en puntos base.
  int32 share_bp = 2;
}

message GetIssueFlowEfficiencyRequest {
  string project_id = 1;
  int32 number = 2;
  // Período opcional. Sin from: desde el alta. Sin to, o con un to futuro:
  // ahora. to antes de from: INVALID_ARGUMENT (INVALID_PERIOD).
  google.protobuf.Timestamp from = 3;
  google.protobuf.Timestamp to = 4;
}

message GetIssueFlowEfficiencyResponse {
  // Ausente si el issue no tiene historia de sesiones en el período.
  FlowEfficiency efficiency = 1;
  // Desde cuándo hay historia de sesiones del issue. Ausente: ninguna.
  google.protobuf.Timestamp recorded_since = 2;
  // Esperas a una persona del issue en el período (pending es 0 o 1).
  // Ausente igual que efficiency.
  HumanQueue human_queue = 3;
}
